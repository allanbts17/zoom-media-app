<!-- Meetings -->
<section class="flex-none rounded-lg border border-gray-400 dark:border-white/20 bg-white dark:bg-white/5 mb-4">
  <!-- Clickable Header -->
  <header class="p-3 flex justify-between items-center cursor-pointer hover:bg-gray-100 dark:hover:bg-white/10 transition-colors"
          (click)="toggleMeetings()"
          [class.rounded-t-lg]="true"
          [class.rounded-b-lg]="isMeetingsCollapsed()">
    <h2 class="font-medium text-sm text-gray-700 dark:text-gray-200">Reunión de Zoom</h2>
    <svg class="transition-transform duration-200 text-gray-500 dark:text-gray-400" [class.rotate-180]="!isMeetingsCollapsed()" width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg>
  </header>

  <!-- Collapsible Content -->
  <div class="p-3 pt-4 border-t border-gray-400 dark:border-white/10" *ngIf="!isMeetingsCollapsed()">
    <label class="text-sm block mb-1 text-gray-700 dark:text-gray-300">Selecciona una reunión guardada</label>
    <select class="border border-gray-500 dark:border-white/20 rounded px-3 py-2 w-full bg-white dark:bg-neutral-800 text-gray-900 dark:text-neutral-100"
            [ngModel]="selectedMeetingId()"
            (ngModelChange)="selectMeeting($event)">
      <option value="">-- Selecciona --</option>
      <option *ngFor="let m of meetings" [value]="m.id">
        {{ (m.title ? (m.title + ' · ') : '') + m.number }}
      </option>
    </select>

    <div class="flex flex-wrap gap-2 items-center mt-3">
      <button class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50"
              (click)="createBot()" [disabled]="!meetingSelected()?.number || !agentReady() || vmBusy() || !!botAction() || !!state.botId">
        {{ botAction() === 'join' ? 'Conectando…' : botConnected() ? 'Bot listo ✅' : 'Crear bot y unir' }}
      </button>

      <button class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50"
              (click)="removeBot()" [disabled]="!state.botId || !!botAction() || vmBusy()">
        Retirar bot
      </button>

      <button type="button" (click)="toggleVm()" [disabled]="vmBusy() || !!botAction()"
              [attr.aria-label]="vmButtonLabel" [title]="vmButtonLabel + ' · ' + vmStatus()"
              class="inline-flex items-center gap-2 px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50">
        <svg *ngIf="vmBusy()" class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" opacity=".25"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
        <svg *ngIf="!vmBusy() && vmStatus() === 'RUNNING'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></svg>
        <svg *ngIf="!vmBusy() && vmStatus() === 'TERMINATED'" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg>
        <svg *ngIf="!vmBusy() && !['RUNNING','TERMINATED'].includes(vmStatus())" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 9M20 2v5h-5"/></svg>
        <span>{{ vmBusy() ? vmButtonLabel : vmStatus() === 'RUNNING' ? 'Detener VM' : vmStatus() === 'TERMINATED' ? 'Encender VM' : 'Estado VM' }}</span>
      </button>

      <span *ngIf="state.botId" class="text-sm text-gray-700 dark:text-gray-300">Bot ID: <span class="font-mono">{{ state.botId }}</span></span>
    </div>

    <p *ngIf="controlMessage()" role="status" aria-live="polite" class="mt-3 text-sm" [class.text-red-600]="controlError()" [class.dark:text-red-400]="controlError()" [class.text-gray-600]="!controlError()" [class.dark:text-gray-300]="!controlError()">{{ controlMessage() }}</p>

    <div class="mt-4 flex flex-wrap gap-2">
      <button type="button"
              class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10"
              (click)="state.err = ''; newMeetingDialog.showModal()">
        Nueva reunión
      </button>
      <button type="button"
              class="px-3 py-2 rounded border border-red-500 dark:border-red-400 text-red-700 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 disabled:opacity-50"
              [disabled]="!meetingSelected()?.id || isDeletingMeeting()"
              (click)="deleteMeeting()">
        Eliminar reunión
      </button>
    </div>

    <div class="mt-4 border-t border-gray-400 dark:border-white/10 pt-3">
      <div class="text-sm mb-2 text-gray-700 dark:text-gray-300">Añadir videos</div>
      <div class="flex flex-wrap gap-2 items-center">
        <input #fileImportInput type="file" id="fileInput" accept="video/*" multiple (change)="fileChangeListener($event)">
        <button class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 flex items-center gap-2" (click)="fileImportInput.click()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Local
        </button>

        <div class="flex-1 min-w-[200px] relative">
          <div class="flex items-center border border-gray-500 dark:border-white/20 rounded bg-white dark:bg-neutral-800 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
            <div class="pl-3 text-gray-400">
              <svg width="14" height="14" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="currentColor"/>
                <path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.3C.4 49.7 0 51.25 0 52.8h27.5z" fill="currentColor"/>
                <path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 10.6z" fill="currentColor"/>
                <path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z" fill="currentColor"/>
                <path d="M59.8 52.8H27.5L13.75 76.6c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="currentColor"/>
                <path d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 52.8h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="currentColor"/>
              </svg>
            </div>
            <input type="text"
                   class="w-full bg-transparent border-none focus:ring-0 py-2 px-3 text-sm text-gray-900 dark:text-neutral-100 placeholder-gray-400"
                   placeholder="Buscar himno en Drive (ej: 504)..."
                   [ngModel]="state.driveSearchQuery()"
                   (ngModelChange)="updateDriveSearch($event)"
                   (focus)="requestDrive()">
            <button *ngIf="state.driveSearchQuery()"
                    (click)="state.driveSearchQuery.set('')"
                    class="p-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="isUploading" class="mt-3">
        <div class="relative w-full h-1 overflow-hidden rounded bg-gray-200 dark:bg-white/10">
          <div class="absolute inset-y-0 left-0 w-1/3 -translate-x-full animate-loading-bar bg-blue-500 dark:bg-white/70"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<dialog #newMeetingDialog
        aria-labelledby="new-meeting-title"
        class="fixed inset-0 m-auto w-[calc(100%-2rem)] max-w-lg max-h-[90vh] overflow-y-auto rounded-lg border border-gray-400 dark:border-white/20 bg-white dark:bg-neutral-800 p-5 text-gray-900 dark:text-neutral-100 shadow-xl backdrop:bg-black/50">
  <header class="flex items-center justify-between gap-4 mb-4">
    <h2 id="new-meeting-title" class="font-medium">Añadir nueva reunión</h2>
    <button type="button"
            class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 hover:bg-gray-100 dark:hover:bg-white/10"
            (click)="newMeetingDialog.close()">Cerrar</button>
  </header>
  <form #newMeetingForm="ngForm" class="flex flex-col gap-3" (ngSubmit)="newMeetingForm.valid && addMeeting(newMeetingDialog)">
    <label class="text-sm" for="new-meeting-title-input">Título (opcional)</label>
    <input id="new-meeting-title-input" name="title" autofocus
           class="border border-gray-500 dark:border-white/20 rounded px-3 py-2 w-full bg-white dark:bg-neutral-800"
           placeholder="Título (opcional)" [(ngModel)]="newTitle" />
    <label class="text-sm" for="new-meeting-number">URL de reunión</label>
    <input id="new-meeting-number" name="meetingNumber" type="text" required
           pattern="https?:\/\/([a-z0-9\-\.]+\.)*zoom\.us\/j\/[0-9]{9,11}(?:[?#].*)?" aria-describedby="new-meeting-number-help"
           class="border border-gray-500 dark:border-white/20 rounded px-3 py-2 w-full bg-white dark:bg-neutral-800"
           placeholder="https://zoom.us/j/..." [(ngModel)]="newMeetingUrl" />
    <p id="new-meeting-number-help" class="text-xs text-gray-500 dark:text-gray-400">Pega el enlace de invitación de Zoom</p>
    <label class="text-sm" for="new-meeting-password">Contraseña de la reunión (Optional)</label>
    <input id="new-meeting-password" name="meetingPassword" type="password" autocomplete="off" maxlength="128"
           aria-describedby="new-meeting-password-help"
           class="border border-gray-500 dark:border-white/20 rounded px-3 py-2 w-full bg-white dark:bg-neutral-800"
           placeholder="Código de acceso" [(ngModel)]="newMeetingPassword" />
    <p id="new-meeting-password-help" class="text-xs text-gray-500 dark:text-gray-400">Introduce el código original, no el valor pwd del enlace. Déjalo vacío si la reunión no requiere contraseña.</p>
    <p *ngIf="state.err" role="alert" class="text-sm text-red-600 dark:text-red-400">{{ state.err }}</p>
    <button type="submit" [disabled]="newMeetingForm.invalid"
            class="self-end px-3 py-2 rounded border border-gray-500 dark:border-white/20 hover:bg-gray-100 dark:hover:bg-white/10">Añadir</button>
  </form>
</dialog>
