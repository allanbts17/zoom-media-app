<!-- Tabla de videos -->
<section class="rounded-lg border border-gray-400 dark:border-white/10 flex-1 min-h-0 max-h-[500px] overflow-auto custom-scrollbar">
  <table class="w-full text-sm border-collapse">
    <thead class="sticky top-0 z-20 bg-gray-100 dark:bg-neutral-800 text-gray-700 dark:text-gray-200 border-b border-gray-300 dark:border-white/10">
      <tr>
        <th class="text-left p-2"></th>
        <th class="text-left p-2 w-20"></th>
        <th class="text-left p-2">Nombre</th>
        <th class="text-left p-2">Duración</th>
        <th class="text-left p-2">Acciones</th>
      </tr>
    </thead>
    <tbody cdkDropList [cdkDropListDisabled]="!store.reorderMode" (cdkDropListDropped)="store.drop($event)">
      <tr *ngIf="store.loading"><td colspan="5" class="p-3 text-center text-gray-500 dark:text-gray-400">Cargando...</td></tr>
      <tr *ngIf="!store.loading && store.displayedVideos.length === 0"><td colspan="5" class="p-3 text-center text-gray-500 dark:text-gray-400">No hay videos</td></tr>

      <tr *ngFor="let v of store.displayedVideos" class="border-t border-gray-300 dark:border-white/10 text-gray-800 dark:text-gray-100" cdkDrag>
        <td class="p-2 w-10 text-center" cdkDragHandle [ngClass]="{'cursor-move text-gray-400 hover:text-gray-700 dark:hover:text-white': store.reorderMode}">
          <input *ngIf="!store.reorderMode" width="20" height="20" type="checkbox" [checked]="!!store.selectedMap[v.videoPath]" (change)="store.toggle(v.videoPath)" />
          <svg *ngIf="store.reorderMode" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </td>
        <td class="p-2">
          <img class="w-20 h-16 object-cover bg-gray-200 dark:bg-black/10 rounded"
              [src]="v.thumbnailUrl" alt="Thumbnail" />
        </td>
        <td class="p-2 break-all">{{ getName(v.videoPath) }}</td>
        <td class="p-2">
            {{ v.duration | duration }}
        </td>
        <td class="p-2">
          <div class="flex flex-col gap-2">
            <button class="px-2 py-1 border border-gray-500 dark:border-white/20 rounded text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50"
                    (click)="store.playSingle(v)" [disabled]="!store.botId || store.busyRow === v.videoPath">
              {{ store.busyRow === v.videoPath ? '...' : 'Reproducir' }}
            </button>
            <a class="px-2 py-1 border border-gray-500 dark:border-white/20 text-center rounded text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10" [href]="v.videoUrl" target="_blank" rel="noreferrer">
              Abrir URL
            </a>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</section>
