<!-- Acciones globales -->
<div class="flex-none flex flex-wrap gap-2 mb-3 items-center">
  <!--
  <button class="px-3 py-2 rounded border border-gray-300 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50"
          (click)="store.playQueue()"
          [disabled]="!store.botId || store.playing || store.selectedList().length === 0">
    Reproducir en cola
  </button>
  -->
  <button class="p-2.5 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50 transition-colors inline-flex items-center justify-center"
          (click)="store.stopNow()" [disabled]="!store.botId"
          title="Detener" aria-label="Detener">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <rect x="5" y="5" width="14" height="14" rx="2" />
    </svg>
  </button>
  <button class="p-2.5 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10 disabled:opacity-50 transition-colors inline-flex items-center justify-center"
          (click)="store.stopNow()" [disabled]="!store.botId"
          title="Pausa" aria-label="Pausa">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <rect x="6" y="4" width="4" height="16" rx="1" />
      <rect x="14" y="4" width="4" height="16" rx="1" />
    </svg>
  </button>
  
  <div class="h-6 w-px bg-gray-400 dark:bg-white/20 mx-2"></div>
  
  <!-- <label class="text-sm text-gray-700 dark:text-gray-300">Lista:</label> -->
  <select class="border border-gray-500 dark:border-white/20 rounded px-3 py-2 bg-white dark:bg-neutral-800 text-gray-900 dark:text-neutral-100"
          [ngModel]="store.activeListId()"
          (ngModelChange)="store.activeListId.set($event)">
    <option value="all">Todos los videos</option>
    <option *ngFor="let list of store.videoLists" [value]="list.id">{{ list.name }}</option>
  </select>

  <button *ngIf="store.activeListId() !== 'all'" 
          class="px-2 py-2 rounded text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 hover:bg-red-50 dark:hover:bg-white/5"
          (click)="store.deleteCurrentList()"
          title="Borrar lista actual">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
  </button>

  <div class="ml-auto flex gap-2">
    <button *ngIf="store.reorderMode" class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10"
            (click)="store.cancelReorder()">
      Cancelar
    </button>
    <button class="px-3 py-2 rounded border border-gray-500 dark:border-white/20 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/10"
            (click)="store.toggleReorder()" [ngClass]="{'bg-blue-600 hover:bg-blue-500 text-white border-blue-600': store.reorderMode}">
      {{ store.reorderMode ? 'Guardar orden' : 'Reordenar' }}
    </button>
  </div>
</div>
