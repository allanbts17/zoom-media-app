<div class="relative">
  <button #trigger type="button" (click)="toggle()" [disabled]="busy()" aria-haspopup="menu"
    [attr.aria-expanded]="open()" aria-controls="user-menu-actions" [attr.aria-label]="'Cuenta de ' + auth.username()"
    class="inline-flex max-w-52 items-center gap-2 rounded-full border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 transition hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600 disabled:opacity-50 dark:border-white/20 dark:bg-neutral-800 dark:text-neutral-100 dark:hover:bg-neutral-700">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
    </svg>
    <span class="truncate">{{ auth.username() }}</span>
    <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" class="shrink-0" aria-hidden="true"><path fill-rule="evenodd" d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4Z" clip-rule="evenodd" /></svg>
  </button>
  @if (open()) {
    <div id="user-menu-actions" role="menu" aria-label="Opciones de cuenta" class="absolute right-0 z-30 mt-2 w-48 rounded-xl border border-gray-200 bg-white p-1 shadow-lg dark:border-white/15 dark:bg-neutral-800">
      <button type="button" role="menuitem" (click)="logout()" [disabled]="busy()"
        class="flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-sm text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-600 disabled:opacity-50 dark:text-neutral-100 dark:hover:bg-white/10">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
        {{ busy() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    </div>
  }
  @if (error()) {
    <p role="alert" class="absolute right-0 z-30 mt-2 w-64 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-200">{{ error() }}</p>
  }
</div>
