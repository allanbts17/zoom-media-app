<main class="h-dvh min-h-0 bg-gray-50 text-gray-900 dark:bg-neutral-900 dark:text-neutral-100 p-4 max-w-5xl mx-auto
flex flex-col overflow-hidden
">


    <header class="flex-none mb-4 flex items-center justify-between gap-3">
      <h1 class="min-w-0 flex-1 truncate text-2xl font-semibold tracking-tight" title="Zoom Media Controller">Zoom Media Controller</h1>
      <app-user-menu class="shrink-0"></app-user-menu>
    </header>

  <app-meetings-panel (driveRequested)="mediaTable.openDrive()"></app-meetings-panel>

  <app-global-actions></app-global-actions>

  <app-selection-bar></app-selection-bar>

  <!-- Errores -->
  <div *ngIf="state.err" class="flex-none mb-3 p-2 border border-red-400 text-red-700 dark:text-red-200 rounded bg-red-50 dark:bg-red-900/30">
    {{ state.err }}
  </div>


  <app-media-table #mediaTable></app-media-table>



  <!-- <p class="flex-none mt-3 text-xs text-gray-500 dark:text-gray-400">
    Tip: "Duración" se calcula con metadatos del video sin descargar el archivo completo.
  </p> -->
</main>
