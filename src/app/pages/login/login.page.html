<main class="login-shell min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10 text-gray-900 dark:bg-neutral-950 dark:text-neutral-100">
  <section class="login-card w-full max-w-md rounded-2xl border border-gray-200 bg-white p-7 shadow-sm sm:p-10 dark:border-white/10 dark:bg-neutral-900" aria-labelledby="login-title">
    <div class="mb-8 flex items-center gap-3">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-white" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="12" height="12" rx="3" />
          <path d="m15 10 5-3v10l-5-3" />
        </svg>
      </span>
      <p class="text-sm font-semibold tracking-tight">Zoom Media Controller</p>
    </div>

    <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-blue-600 dark:text-blue-400">Tus reuniones, tus medios</p>
    <h1 id="login-title" class="text-3xl font-semibold tracking-tight">Iniciar sesión</h1>
    <p class="mt-3 text-sm leading-6 text-gray-500 dark:text-neutral-400">
      Accede con tu cuenta de Google para gestionar tus reuniones y contenidos.
    </p>

    @if (error()) {
      <p role="alert" class="mt-6 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200">{{ error() }}</p>
    }

    <button type="button" (click)="continueWithGoogle()" [disabled]="busy()" [attr.aria-busy]="busy()"
      class="mt-7 flex min-h-12 w-full items-center justify-center gap-3 rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm font-semibold text-gray-800 transition hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600 disabled:cursor-wait disabled:opacity-60 dark:border-white/20 dark:bg-neutral-800 dark:text-white dark:hover:bg-neutral-700">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" />
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.03 46.98 31.87 46.98 24.55Z" />
        <path fill="#FBBC05" d="M10.53 28.59A14.41 14.41 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.86 23.86 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z" />
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" />
      </svg>
      <span aria-live="polite">{{ busy() ? 'Conectando con Google…' : 'Continuar con Google' }}</span>
    </button>

    <p class="mt-4 text-center text-xs leading-5 text-gray-500 dark:text-neutral-500">Sin contraseñas adicionales. Tu sesión se conserva en este dispositivo hasta que la cierres.</p>


  </section>
</main>
